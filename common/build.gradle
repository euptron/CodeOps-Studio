plugins {
    alias(libs.plugins.android.library)
}
android {
    namespace 'com.eup.codeopsstudio.common'
    compileSdk project.ext.compileSdkVersion
    buildToolsVersion project.ext.buildToolsVersion

    defaultConfig {
        minSdk project.ext.minSdkVersion
        targetSdk project.ext.targetSdkVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility project.ext.javaSourceVersion
        targetCompatibility project.ext.javaTargetVersion
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    api(libs.androidx.documentfile)
    api(libs.google.guava)
    api(libs.google.gson)
    api(libs.other.commons.io)
    api(libs.other.eclipse.jgit)
    api(libs.other.eclipse.jgit.ssh.jsch)
    api(libs.other.greenrobot.eventbus)
    api(libs.other.jsoup)
    api(libs.other.volley)
    api(libs.other.albfernandez.juniversalchardet)
    api(libs.other.lingala.zip4j)

    implementation(libs.androidx.appcompat)
    implementation libs.androidx.core.ktx
    implementation(libs.androidx.preference)
    implementation(libs.google.material)

    implementation project(path: ":shared-res")
    implementation project(path: ":modules:ast-core")
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}
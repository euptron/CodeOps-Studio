plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.eup.codeopsstudio.editor'
    compileSdk project.ext.compileSdkVersion
    buildToolsVersion project.ext.buildToolsVersion

    defaultConfig {
        minSdk project.ext.minSdkVersion
        targetSdk project.ext.targetSdkVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility project.ext.javaSourceVersion
        targetCompatibility project.ext.javaTargetVersion
    }

    buildFeatures {
        viewBinding true
    }

}

dependencies {
    implementation(libs.google.material)
    api(platform(libs.other.sora.editor.bom))
    api(libs.other.sora.editor.code)
    api(libs.other.sora.editor.lsp)
    api(libs.other.sora.editor.textmate)
    implementation project(path: ":common")
    implementation project(path: ":shared-res")
}

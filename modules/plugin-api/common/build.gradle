plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}
    
android {
    namespace 'com.eup.codeops.common.plugin.api'
    compileSdk project.ext.compileSdkVersion
    buildToolsVersion project.ext.buildToolsVersion

    defaultConfig {
        minSdk project.ext.minSdkVersion
        targetSdk project.ext.targetSdkVersion
        multiDexEnabled true
    }
                
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility project.ext.javaSourceVersion
        targetCompatibility project.ext.javaTargetVersion
    }
    
    publishing {
        singleVariant("release")
    }
}

dependencies {
    implementation(libs.androidx.annotation)
    coreLibraryDesugaring(libs.other.desugar)
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                
                groupId = 'io.github.euptron'
                artifactId = 'plugin-api-common'
                version = '0.1.0'
                
                pom {
                    name = 'plugin-api common'
                    description = 'Plugin Common API.'
                    url = 'https://github.com/euptron/CodeOps-Studio'
                    
                    licenses {
                        license {
                            name = 'Apache License v2.0'
                            url = 'https://github.com/euptron/CodeOps-Studio/blob/main/modules/plugin-api/common/LICENSE'
                            distribution = 'repo'
                        }
                    }
                    
                    developers {
                        developer {
                            id = 'euptron'
                            name = 'Etido Peter'
                            email = 'euptron@gmail.com'
                        }
                    }
                    
                    scm {
                        connection = 'scm:git:github.com/euptron/CodeOps-Studio.git'
                        developerConnection = 'scm:git:ssh://github.com/euptron/CodeOps-Studio.git'
                        url = 'https://github.com/euptron/CodeOps-Studio'
                    }
                }
            }
        }
        
        repositories {
            maven {
                name = "GitHubPackages"
                url = "https://maven.pkg.github.com/euptron/CodeOps-Studio"
                credentials {
                    username = "euptron"
                    password = System.getenv("GHPKGS_LIB_PUB_TOKEN")
                }
            }
        }
    }
}
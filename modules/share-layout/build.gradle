plugins {
    alias(libs.plugins.android.library)
}
android {
    namespace 'com.eup.libraries.sharelayout'
    compileSdk {
        version = release(project.ext.compileSdkVersion) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdk project.ext.minSdkVersion
        targetSdk project.ext.targetSdkVersion
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility project.ext.javaSourceVersion
        targetCompatibility project.ext.javaTargetVersion
    }

    buildFeatures {
        viewBinding true
    }
}
dependencies {
    implementation libs.androidx.core.ktx
    implementation(libs.google.material)
    implementation(libs.androidx.appcompat)
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}
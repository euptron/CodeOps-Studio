[libraries]
# AndroidX
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppCompat" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintLayout" }
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "androidxNavigationFragment" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "androidxNavigationUi" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "androidxPreference" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "androidxSwipeReFreshLayout" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxSplashScreen" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "androidxWorkRuntime" }
androidx-data-store = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDataStore" }
# Google
google-material = { group = "com.google.android.material", name = "material", version.ref = "googleMaterial" }
google-guava = { group = "com.google.guava", name = "guava", version.ref = "googleGuava" }
google-gson = { group = "com.google.code.gson", name = "gson", version.ref = "googleGson" }
google-play-services-oss-licenses = { group = "com.google.android.gms", name = "play-services-oss-licenses", version.ref = "googlePlayServicesOSSLicenses" }
# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-inappmessaging = { group = "com.google.firebase", name = "firebase-inappmessaging-display" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
# Other
other-junit = { group = "junit", name = "junit", version.ref = "junit" }
other-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
other-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
oss-licenses-plugin = { group = "com.google.android.gms", name = "oss-licenses-plugin", version.ref = "ossLicensesPlugin" }
other-commons-io = { group = "commons-io", name = "commons-io", version.ref = "commonsIO" }
other-lingala-zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
other-volley = { group = "com.android.volley", name = "volley", version.ref = "volley" }
other-jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
other-albfernandez-juniversalchardet = { group = "com.github.albfernandez", name = "juniversalchardet", version.ref = "juniversalchardet" }
other-eclipse-jgit = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version.ref = "jgit" }
other-eclipse-jgit-ssh-jsch = { group = "org.eclipse.jgit", name = "org.eclipse.jgit.ssh.jsch", version.ref = "jgit" }
other-greenrobot-eventbus = { group = "org.greenrobot", name = "eventbus", version.ref = "greenRobotEventBus" }
other-commonmark = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }
other-apisense-rhino-android = { group = "io.apisense", name = "rhino-android", version.ref = "rhinoAndroid" }
other-desugar = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJDK" }

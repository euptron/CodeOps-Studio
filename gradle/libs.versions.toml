other-leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanaryAndroid" }
other-sora-editor-bom = { group = "io.github.Rosemoe.sora-editor", name = "bom", version.ref = "soraEditorBom" }
other-sora-editor-code = { group = "io.github.Rosemoe.sora-editor", name = "editor" }
other-sora-editor-textmate = { group = "io.github.Rosemoe.sora-editor", name = "language-textmate" }
other-glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
other-glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }


[plugins]
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServicesPlugin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
androidxDataStore = "1.1.7"
documentfile = "1.1.0"
# Google
googleMaterial = "1.13.0"
googleGuava = "33.4.8-android"
googleGson = "2.10"
googlePlayServicesOSSLicenses = "17.3.0"
# Firebase
firebaseBom = "34.0.0"

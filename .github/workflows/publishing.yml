name: Publishing CI

on:
  workflow_dispatch:

jobs:
  build:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    
    steps:
      - name: Cancel Previous Workflow Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set-up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Grant Permissions for Gradle
        run: chmod +x ./gradlew
        
      - name: Publish Libraries
        env:
          GHPKGS_LIB_PUB_TOKEN: ${{ secrets.GHPKGS_LIB_PUB_TOKEN }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_GPG_SIGNING_KEY: ${{ secrets.SONATYPE_GPG_SIGNING_KEY }}
          SONATYPE_GPG_SIGNING_PASSWORD: ${{ secrets.SONATYPE_GPG_SIGNING_PASSWORD }}
        run: |
          echo "Publishing libraries..."
          ./gradlew publish
          echo "Libraries published!"